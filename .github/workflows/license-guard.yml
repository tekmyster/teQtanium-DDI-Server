name: Community source boundary
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  community-source:
    if: '!github.event.repository.private'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Provenance validation reads immutable ancestor blobs, not just HEAD.
          fetch-depth: 0
      - name: Check eligible source and private exclusions
        shell: pwsh
        run: ./scripts/check-public-license.ps1 -PublicationScope CommunitySource
