name: License boundary
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  license-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check reviewed community source and private exclusions
        shell: pwsh
        run: ./scripts/check-public-license.ps1 -SourceOnly
